version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-vendedor-ia
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vendedor_ia}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-vendedor-ia
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Mendoza}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=https://seminocturnal-willena-unbeseeching.ngrok-free.dev
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/data:ro
    # Ideal para pruebas con Telegram.
    command: start
  backend:
    build: ./backend
    container_name: backend-vendedor-ia
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vendedor_ia}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - N8N_API_KEY=${N8N_API_KEY}
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: frontend-vendedor-ia
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  redis:
    image: redis:7-alpine
    container_name: redis-vendedor-ia
    restart: unless-stopped
    # No exponemos puertos hacia afuera. Solo los contenedores internos (n8n, backend) podrán ver a Redis.
    # command: redis-server --save 60 1 --loglevel warning
