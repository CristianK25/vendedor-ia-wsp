version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-vendedor-ia
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vendedor_ia}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./db_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-vendedor-ia
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Mendoza}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/data:ro
    # El comando 'start --tunnel' genera una URL temporal publica.
    # Ideal para pruebas con Telegram. En produccion, quitar '--tunnel'.
    command: start --tunnel
