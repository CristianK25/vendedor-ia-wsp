services:
  db:
    image: postgres:16-alpine
    container_name: postgres-vendedor-ia
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vendedor_ia}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-vendedor-ia
    restart: unless-stopped
    depends_on:
      - db
      - redis
    # ports:
    #   - "5678:5678"  # COMENTADO POR SEGURIDAD: Usar NPM con el dominio n8n-lvm.autoleadcrm.tech
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Mendoza}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_PROXY_HOPS=1
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/data:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build: ./backend
    container_name: backend-vendedor-ia
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-vendedor_ia}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DB_ECHO=${DB_ECHO:-false}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook
      - SECRET_KEY=${SECRET_KEY}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@vendedor.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-admin123}
      - INITIAL_BOT_EMAIL=${INITIAL_BOT_EMAIL:-bot@vendedor.com}
      - INITIAL_BOT_PASSWORD=${INITIAL_BOT_PASSWORD:-bot1234}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-groq,openrouter,gemini,openai,anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./backend/fotos:/app/fotos
      - ./backend/documentos:/app/documentos
      - ./backend/gastos:/app/gastos
      - ./logs:/app/logs
    command: sh -c "python init_db.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: frontend-vendedor-ia
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm-vendedor-ia
    restart: unless-stopped
    ports:
      - '80:80'     # Tráfico HTTP público
      - '443:443'   # Tráfico HTTPS público
      - '127.0.0.1:81:81' # Panel NPM restringido a localhost (acceder vía túnel SSH)
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis-vendedor-ia
    restart: unless-stopped
    # No exponemos puertos hacia afuera. Solo los contenedores internos (n8n, backend) podrán ver a Redis.
    # command: redis-server --save 60 1 --loglevel warning
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  laya:
    build: ./laya
    container_name: laya-vendedor-ia
    restart: unless-stopped
    volumes:
      - ./laya_cache:/cache
    # Blindaje estricto de recursos para proteger Postgres, n8n y Backend
    cpus: "1.0"          # Máximo 1 solo núcleo de CPU (el otro núcleo queda libre para tu DB y n8n)
    cpu_shares: 512      # Prioridad baja: si la CPU se satura, Postgres y n8n tienen preferencia
    mem_limit: 1536m     # Tope máximo de 1.5 GB de RAM (la VPS tiene 8 GB)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

