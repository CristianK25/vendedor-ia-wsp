name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar el despliegue manualmente desde la interfaz de GitHub

jobs:
  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Conectar al VPS y desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "Accediendo al directorio del proyecto..."
            cd ~/crm # Ajusta a la ruta absoluta en tu VPS (ej. /root/crm o /home/usuario/crm) si no está en ~/crm
            
            echo "Descargando últimos cambios de Git..."
            git pull origin main
            
            echo "Reconstruyendo y levantando contenedores con Docker Compose..."
            docker compose up -d --build
            
            echo "¡Despliegue completado con éxito!"

